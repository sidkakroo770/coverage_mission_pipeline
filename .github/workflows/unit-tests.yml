name: Unit tests

on:
  push:
  pull_request:

jobs:
  non_ros_tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest shapely pyproj PyYAML pymavlink
      - name: Compile package
        run: python -m compileall -q coverage_mission_pipeline
      - name: Run non-ROS tests
        run: |
          python -m pytest -q \
            test/test_kml_product.py \
            test/test_existing_simulation.py \
            test/test_mission_fingerprint.py \
            test/test_route_connector.py
